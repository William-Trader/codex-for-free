<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关于 Codex for Free</title>
<style>
:root{--bg:#212121;--text:#ececec;--muted:#b4b4b4;--line:#333}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:grid;place-items:center;font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
.card{width:420px;max-width:calc(100vw - 40px);text-align:center;padding:36px 28px 24px}
.avatar{width:96px;height:96px;border-radius:24px;display:block;margin:0 auto 18px}
h1{font-size:24px;margin:0 0 6px;font-weight:650}
.powered{color:var(--muted);font-size:13px;margin-bottom:18px}
.powered b{color:#fff}
.version,.date{color:var(--muted);font-size:13px;margin:2px 0}
.tagline{color:#d6d6d6;font-size:14px;margin:18px 0 20px;line-height:1.7}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.links a{color:#10a37f;text-decoration:none;font-size:12px;border:1px solid #3a3a3a;border-radius:999px;padding:5px 12px}
.links a:hover{border-color:#6b6b6b}
.copy{color:#8a8a8a;font-size:11px;border-top:1px solid var(--line);padding-top:14px}
.back{position:fixed;left:20px;top:18px;color:#10a37f;text-decoration:none;font-size:12px}
</style>
</head>
<body>
<a class="back" href="/">← 返回面板</a>
<main class="card">
  <img class="avatar" src="/avatar.svg" alt="William">
  <h1>Codex for Free</h1>
  <div class="powered">Powered by <b id="name">William</b></div>
  <div class="version" id="version">v1.0.0</div>
  <div class="date" id="date"></div>
  <p class="tagline" id="tagline">让 Codex 对每个人都友好。</p>
  <div class="links">
    <a id="repo" href="https://github.com/William-Trader/codex-for-free" target="_blank" rel="noreferrer">GitHub</a>
    <a href="/">打开面板</a>
  </div>
  <div class="copy" id="copy">© 2026 William</div>
</main>
<script>
fetch('/api/about').then(r => r.json()).then(a => {
  document.getElementById('name').textContent = a.name;
  document.getElementById('version').textContent = 'v' + a.app.version;
  document.getElementById('date').textContent = '发布于 ' + a.releaseDate;
  document.getElementById('tagline').textContent = a.tagline;
  document.getElementById('copy').textContent = a.copyright;
  document.getElementById('repo').href = a.repo;
}).catch(() => {});
</script>
</body>
</html>
